
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch name

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          # Track npm current-major (12): runner-default npm 11 crashes
          # lockfile-less resolves with "Cannot read properties of null
          # (reading 'edgesOut')". sudo needed: runner npm lives in /usr/local.
          sudo npm install -g npm@12.2.0
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
          clean: true # Automatically remove deleted files from the deploy branch
          single-commit: true # This destroys the history of gh-pages and forces a clean slate every time
